version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: rda-postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: production_secure_pass
      POSTGRES_DB: rwanda_sector_data
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - rda_mesh_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rwanda_sector_data"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rda-redis-broker
    ports:
      - "6379:6379"
    networks:
      - rda_mesh_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rda-fastapi-backend
    command: python run.py
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:production_secure_pass@db:5432/rwanda_sector_data
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rda_mesh_network

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rda-celery-worker
    command: celery -A app.scheduler.celery_app worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:production_secure_pass@db:5432/rwanda_sector_data
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rda_mesh_network

  frontend:
    build:
      context: ./frontend
    container_name: rda-nextjs-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api
    networks:
      - rda_mesh_network

volumes:
  postgres_data:

networks:
  rda_mesh_network:
    driver: bridge
